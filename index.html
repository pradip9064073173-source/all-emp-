<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index Wallet Pradip Patra</title>
    <style>
        :root {
            --primary-bg: #87CEEB; /* Sky Blue */
            --container-bg: #ffffff;
            --text-color: #333333;
            --btn-color: #007BFF;
            --btn-hover: #0056b3;
            --danger-color: #dc3545;
            --info-color: #17a2b8;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--primary-bg);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--container-bg);
            width: 100%;
            max-width: 1000px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            padding: 30px;
            margin-top: 20px;
        }

        h1, h2, h3 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .hidden {
            display: none !important;
        }

        /* Form Styles */
        .form-group { margin-bottom: 15px; }
        .form-row { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 15px; }
        .form-col { flex: 1; min-width: 250px; }

        label { display: block; margin-bottom: 5px; font-weight: 600; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }

        .checkbox-group { display: flex; align-items: center; gap: 10px; margin: 15px 0; }
        .checkbox-group input { width: auto; }

        /* Buttons */
        button {
            background-color: var(--btn-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover { background-color: var(--btn-hover); }
        button.danger { background-color: var(--danger-color); }
        button.danger:hover { background-color: #a71d2a; }
        button.info { background-color: var(--info-color); }
        button.info:hover { background-color: #117a8b; }

        /* Navigation */
        .nav-menu {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            border-bottom: 2px solid #eee;
            padding-bottom: 20px;
            flex-wrap: wrap;
        }

        /* Employee Cards */
        .employee-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .employee-card {
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .employee-card h3 { margin-bottom: 10px; color: var(--btn-color); }
        .card-actions { margin-top: 15px; display: flex; gap: 8px; flex-wrap: wrap; }
        .card-actions button { flex: 1; padding: 8px; font-size: 13px; }

        /* Document Upload Section */
        .doc-section { background: #f0f8ff; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #b0d4ff; }
        .warning-text { background: #fff3cd; color: #856404; padding: 10px; border-radius: 5px; font-size: 13px; margin-bottom: 15px; border: 1px solid #ffeeba; }

        /* Modal Styles */
        .modal {
            position: fixed;
            z-index: 1000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            color: red;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .doc-item {
            margin-bottom: 20px; padding: 15px;
            border: 1px solid #eee; border-radius: 8px; background: #fdfdfd;
            text-align: center;
        }
        .doc-item img { max-width: 100%; border: 1px solid #ccc; margin-top: 10px; border-radius: 4px; max-height: 400px;}
        
        .download-link {
            display: inline-block;
            margin-top: 15px;
            background: #28a745;
            color: white;
            padding: 8px 15px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }

        .profile-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .profile-table th, .profile-table td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        .profile-table th { background-color: #f4f4f4; width: 35%; }
    </style>
</head>
<body>

    <div class="container" id="main-container">
        <!-- LOGIN SECTION -->
        <div id="login-section">
            <h1>Index Wallet Pradip Patra</h1>
            <h2>Login</h2>
            <form id="login-form">
                <div class="form-group">
                    <label>User ID</label>
                    <input type="text" id="userid" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required>
                </div>
                <p id="login-error" style="color: red; display: none; margin-bottom: 10px;">Invalid Credentials!</p>
                <button type="submit" style="width: 100%;">Login</button>
            </form>
        </div>

        <!-- DASHBOARD -->
        <div id="dashboard-section" class="hidden">
            <h1>Index Wallet Pradip Patra</h1>
            
            <div class="nav-menu">
                <button onclick="showView('add-employee-view')">Add Employee</button>
                <button onclick="renderEmployeeList(); showView('view-employee-view')">View Employee Details</button>
                <button class="danger" onclick="logout()">Logout</button>
            </div>

            <!-- VIEW 1: ADD EMPLOYEE -->
            <div id="add-employee-view">
                <h2 id="form-title">Add New Employee</h2>
                <form id="employee-form">
                    <input type="hidden" id="edit-id" value="">
                    
                    <div class="form-row">
                        <div class="form-col"><label>Employee Name</label><input type="text" id="empName" required></div>
                        <div class="form-col"><label>Company Name</label><input type="text" id="compName" required></div>
                    </div>

                    <div class="form-row">
                        <div class="form-col"><label>Father's Name</label><input type="text" id="fatherName" required></div>
                        <div class="form-col"><label>Mother's Name</label><input type="text" id="motherName" required></div>
                    </div>

                    <div class="form-row">
                        <div class="form-col"><label>Date of Birth</label><input type="date" id="dob" required></div>
                        <div class="form-col"><label>Date of Joining</label><input type="date" id="doj" required></div>
                    </div>

                    <div class="form-group">
                        <label>Present Address</label>
                        <textarea id="presAddress" rows="2" required></textarea>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="sameAddress" onclick="copyAddress()">
                        <label for="sameAddress" style="margin:0;">Same as Present Address</label>
                    </div>

                    <div class="form-group">
                        <label>Permanent Address</label>
                        <textarea id="permAddress" rows="2" required></textarea>
                    </div>

                    <h3 style="margin-top:30px;">Upload Documents & Details</h3>
                    <div class="warning-text">
                        <strong>Important:</strong> Please upload small size files to ensure the system saves them properly.
                    </div>
                    
                    <div class="doc-section form-row">
                        <div class="form-col"><label>Aadhaar Number</label><input type="text" id="aadhaarNum"></div>
                        <div class="form-col"><label>Upload Aadhaar (PDF/JPG/PNG)</label><input type="file" id="aadhaarDoc" accept=".pdf,.jpg,.jpeg,.png"></div>
                    </div>

                    <div class="doc-section form-row">
                        <div class="form-col"><label>Voter Card Number</label><input type="text" id="voterNum"></div>
                        <div class="form-col"><label>Upload Voter Card (PDF/JPG/PNG)</label><input type="file" id="voterDoc" accept=".pdf,.jpg,.jpeg,.png"></div>
                    </div>

                    <div class="doc-section form-row">
                        <div class="form-col"><label>PAN Card Number</label><input type="text" id="panNum"></div>
                        <div class="form-col"><label>Upload PAN Card (PDF/JPG/PNG)</label><input type="file" id="panDoc" accept=".pdf,.jpg,.jpeg,.png"></div>
                    </div>

                    <div class="doc-section form-row">
                        <div class="form-col"><label>Police Verification Cert Number</label><input type="text" id="policeNum"></div>
                        <div class="form-col"><label>Upload Certificate (PDF/JPG/PNG)</label><input type="file" id="policeDoc" accept=".pdf,.jpg,.jpeg,.png"></div>
                    </div>

                    <div class="doc-section form-row">
                        <div class="form-col"><label>Bank Account Number</label><input type="text" id="bankAccNum"></div>
                        <div class="form-col"><label>Upload Bank Passbook/Cheque (PDF/JPG/PNG)</label><input type="file" id="bankDoc" accept=".pdf,.jpg,.jpeg,.png"></div>
                    </div>

                    <div class="doc-section form-row">
                        <div class="form-col"><label>Employee ID</label><input type="text" id="empIdInput" required></div>
                        <div class="form-col"><label>Upload Employee ID (PDF/JPG/PNG)</label><input type="file" id="empIdDoc" accept=".pdf,.jpg,.jpeg,.png"></div>
                    </div>

                    <div class="doc-section form-row">
                        <div class="form-col"><label>Other Documents (Details)</label><input type="text" id="otherNum"></div>
                        <div class="form-col"><label>Upload Other Docs (PDF/JPG/PNG)</label><input type="file" id="otherDoc" accept=".pdf,.jpg,.jpeg,.png"></div>
                    </div>

                    <button type="submit" id="saveBtn" style="width: 100%; margin-top: 10px; padding: 15px; font-size: 18px;">Save Employee Details</button>
                </form>
            </div>

            <!-- VIEW 2: VIEW EMPLOYEE DETAILS -->
            <div id="view-employee-view" class="hidden">
                <h2>Employee Directory</h2>
                <div class="employee-list" id="employee-list-container"></div>
            </div>
        </div>

        <!-- MODALS -->
        <div id="doc-modal" class="modal hidden">
            <div class="modal-content">
                <span class="close-btn" onclick="closeModal('doc-modal')">&times;</span>
                <h2 style="margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom:10px;">Uploaded Documents</h2>
                <div id="modal-docs-container"></div>
            </div>
        </div>

        <div id="profile-modal" class="modal hidden">
            <div class="modal-content">
                <span class="close-btn" onclick="closeModal('profile-modal')">&times;</span>
                <h2 style="margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom:10px;">Employee Full Profile</h2>
                <div id="modal-profile-container"></div>
            </div>
        </div>

    </div>

    <script>
        // --- LOGIN & NAVIGATION LOGIC ---
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            if (document.getElementById('userid').value === 'pradip' && document.getElementById('password').value === 'pradip') {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                document.getElementById('login-error').style.display = 'none';
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        });

        function logout() {
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('userid').value = '';
            document.getElementById('password').value = '';
            showView('add-employee-view');
        }

        function showView(viewId) {
            ['add-employee-view', 'view-employee-view'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(viewId).classList.remove('hidden');
            if(viewId === 'add-employee-view') {
                document.getElementById('employee-form').reset();
                document.getElementById('edit-id').value = "";
                document.getElementById('form-title').innerText = "Add New Employee";
                document.getElementById('saveBtn').innerText = "Save Employee Details";
            }
        }

        function copyAddress() {
            if(document.getElementById('sameAddress').checked) {
                document.getElementById('permAddress').value = document.getElementById('presAddress').value;
            } else {
                document.getElementById('permAddress').value = "";
            }
        }

        // --- FILE SAVING & READING LOGIC ---
        function getBase64(file) {
            return new Promise((resolve, reject) => {
                if (!file) { resolve(null); return; }
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve({ name: file.name, type: file.type, data: reader.result });
                reader.onerror = error => reject(error);
            });
        }

        document.getElementById('employee-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            let employees = JSON.parse(localStorage.getItem('employees')) || [];
            
            document.getElementById('saveBtn').innerText = "Saving... Please wait";
            document.getElementById('saveBtn').disabled = true;

            try {
                const empData = {
                    id: document.getElementById('edit-id').value || Date.now().toString(),
                    empName: document.getElementById('empName').value,
                    compName: document.getElementById('compName').value,
                    fatherName: document.getElementById('fatherName').value,
                    motherName: document.getElementById('motherName').value,
                    dob: document.getElementById('dob').value,
                    doj: document.getElementById('doj').value,
                    presAddress: document.getElementById('presAddress').value,
                    permAddress: document.getElementById('permAddress').value,
                    empIdInput: document.getElementById('empIdInput').value,
                    aadhaarNum: document.getElementById('aadhaarNum').value,
                    voterNum: document.getElementById('voterNum').value,
                    panNum: document.getElementById('panNum').value,
                    policeNum: document.getElementById('policeNum').value,
                    bankAccNum: document.getElementById('bankAccNum').value,
                    otherNum: document.getElementById('otherNum').value,
                    docs: {
                        empIdDoc: await getBase64(document.getElementById('empIdDoc').files[0]),
                        aadhaarDoc: await getBase64(document.getElementById('aadhaarDoc').files[0]),
                        voterDoc: await getBase64(document.getElementById('voterDoc').files[0]),
                        panDoc: await getBase64(document.getElementById('panDoc').files[0]),
                        policeDoc: await getBase64(document.getElementById('policeDoc').files[0]),
                        bankDoc: await getBase64(document.getElementById('bankDoc').files[0]),
                        otherDoc: await getBase64(document.getElementById('otherDoc').files[0]),
                    }
                };

                const editId = document.getElementById('edit-id').value;
                if (editId) {
                    const index = employees.findIndex(emp => emp.id === editId);
                    Object.keys(empData.docs).forEach(key => {
                        if(!empData.docs[key]) empData.docs[key] = employees[index].docs[key] || null;
                    });
                    employees[index] = empData;
                    alert("Employee Updated Successfully!");
                } else {
                    employees.push(empData);
                    alert("Employee Saved Successfully!");
                }

                localStorage.setItem('employees', JSON.stringify(employees));
                document.getElementById('employee-form').reset();
                showView('view-employee-view');
                renderEmployeeList();

            } catch (error) {
                alert("Error saving data. Please ensure files are small in size.");
            } finally {
                document.getElementById('saveBtn').innerText = "Save Employee Details";
                document.getElementById('saveBtn').disabled = false;
            }
        });

        // --- EMPLOYEE VIEWING & MODALS ---
        function renderEmployeeList() {
            const container = document.getElementById('employee-list-container');
            container.innerHTML = '';
            const employees = JSON.parse(localStorage.getItem('employees')) || [];

            if(employees.length === 0) {
                container.innerHTML = '<p style="text-align:center; grid-column: 1 / -1;">No employees found. Please add an employee.</p>';
                return;
            }

            employees.forEach(emp => {
                container.innerHTML += `
                    <div class="employee-card">
                        <h3>${emp.empName}</h3>
                        <p><strong>Company:</strong> ${emp.compName}</p>
                        <p><strong>Employee ID:</strong> ${emp.empIdInput}</p>
                        <div class="card-actions">
                            <button class="info" onclick="viewProfile('${emp.id}')">Profile</button>
                            <button style="background:#28a745;" onclick="viewDocs('${emp.id}')">Docs</button>
                            <button onclick="editEmployee('${emp.id}')">Edit</button>
                            <button class="danger" onclick="deleteEmployee('${emp.id}')">Delete</button>
                        </div>
                    </div>`;
            });
        }

        function deleteEmployee(id) {
            if(confirm("Are you sure you want to delete this employee?")) {
                let employees = JSON.parse(localStorage.getItem('employees')) || [];
                employees = employees.filter(emp => emp.id !== id);
                localStorage.setItem('employees', JSON.stringify(employees));
                renderEmployeeList();
            }
        }

        function editEmployee(id) {
            const employees = JSON.parse(localStorage.getItem('employees')) || [];
            const emp = employees.find(e => e.id === id);
            if(emp) {
                showView('add-employee-view');
                document.getElementById('form-title').innerText = "Edit Employee";
                document.getElementById('saveBtn').innerText = "Update Employee Details";
                document.getElementById('edit-id').value = emp.id;
                
                ['empName', 'compName', 'fatherName', 'motherName', 'dob', 'doj', 'presAddress', 'permAddress', 'empIdInput', 'aadhaarNum', 'voterNum', 'panNum', 'policeNum', 'bankAccNum', 'otherNum'].forEach(field => {
                    if(document.getElementById(field)) document.getElementById(field).value = emp[field] || "";
                });
            }
        }

        function viewProfile(id) {
            const emp = (JSON.parse(localStorage.getItem('employees')) || []).find(e => e.id === id);
            if(emp) {
                document.getElementById('modal-profile-container').innerHTML = `
                    <table class="profile-table">
                        <tr><th>Employee Name</th><td>${emp.empName}</td></tr>
                        <tr><th>Company Name</th><td>${emp.compName}</td></tr>
                        <tr><th>Employee ID</th><td>${emp.empIdInput}</td></tr>
                        <tr><th>Father's Name</th><td>${emp.fatherName}</td></tr>
                        <tr><th>Mother's Name</th><td>${emp.motherName}</td></tr>
                        <tr><th>Date of Birth</th><td>${emp.dob}</td></tr>
                        <tr><th>Date of Joining</th><td>${emp.doj}</td></tr>
                        <tr><th>Present Address</th><td>${emp.presAddress}</td></tr>
                        <tr><th>Permanent Address</th><td>${emp.permAddress}</td></tr>
                        <tr><th>Aadhaar Number</th><td>${emp.aadhaarNum || 'N/A'}</td></tr>
                        <tr><th>Voter Card Number</th><td>${emp.voterNum || 'N/A'}</td></tr>
                        <tr><th>PAN Card Number</th><td>${emp.panNum || 'N/A'}</td></tr>
                        <tr><th>Bank Account Number</th><td>${emp.bankAccNum || 'N/A'}</td></tr>
                    </table>
                `;
                document.getElementById('profile-modal').classList.remove('hidden');
            }
        }

        function viewDocs(id) {
            const emp = (JSON.parse(localStorage.getItem('employees')) || []).find(e => e.id === id);
            if(emp) {
                let html = `<h3>Documents for: ${emp.empName}</h3><br>`;
                const genDoc = (docObj, title, numStr) => {
                    let res = `<div class="doc-item"><h4>${title} ${numStr ? '(No: '+numStr+')' : ''}</h4>`;
                    if(docObj && docObj.data) {
                        if(docObj.type.startsWith('image/')) res += `<img src="${docObj.data}"><br><a class="download-link" href="${docObj.data}" download="${docObj.name}">Download</a>`;
                        else res += `<p style="color:green; font-weight:bold;">File Attached.</p><a class="download-link" href="${docObj.data}" download="${docObj.name}">Download</a>`;
                    } else res += `<p style="color:gray;">Not Uploaded</p>`;
                    return res + `</div>`;
                };
                html += genDoc(emp.docs.empIdDoc, 'Employee ID', emp.empIdInput);
                html += genDoc(emp.docs.aadhaarDoc, 'Aadhaar Card', emp.aadhaarNum);
                html += genDoc(emp.docs.voterDoc, 'Voter Card', emp.voterNum);
                html += genDoc(emp.docs.panDoc, 'PAN Card', emp.panNum);
                html += genDoc(emp.docs.bankDoc, 'Bank Details', emp.bankAccNum);
                document.getElementById('modal-docs-container').innerHTML = html;
                document.getElementById('doc-modal').classList.remove('hidden');
            }
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        }
    </script>
</body>
</html>
